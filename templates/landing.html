<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rugby Analytics — {{ club_full_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='demo-mode.js') }}"></script>
</head>
<body class="landing-body" data-demo-forced="{{ 'true' if demo_forced else 'false' }}">

{% include "_match_subnav.html" %}

<div class="landing-screen">
    <img src="{{ url_for('static', filename='logo.png') }}" class="landing-logo" alt="{{ club_full_name }}">
    <p class="landing-subtitle">{{ club_full_name }}</p>

    <div class="landing-choice-row">
        <a class="landing-choice-btn" href="{{ url_for('analyse_video') }}">🎥 Analyse vidéo</a>
        {% if not demo_forced %}
        <a class="landing-choice-btn" href="{{ url_for('documents') }}">📁 Documents</a>
        <a class="landing-choice-btn" href="{{ url_for('calendrier') }}">🗓️ Calendrier</a>
        <a class="landing-choice-btn" href="{{ url_for('cahier_charges') }}">📋 Cahier des charges</a>
        {% endif %}
    </div>
</div>
</body>
</html>
