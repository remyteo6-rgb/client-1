{% import "_ppid_icons.html" as icons %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réveil du serveur…</title>
<style>
    /* Page volontairement autonome : elle doit s'afficher même quand le serveur dort,
       donc sans dépendre de la feuille de style du site. */
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 0%, #1b1020 0%, #0b080e 60%);
        color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
    }
    .reveil { width: 100%; max-width: 520px; text-align: center; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .ppid-icon { display: inline-block; vertical-align: -2px; flex-shrink: 0; }
    .sous-titre { margin: 0 0 30px; font-size: .92rem; color: rgba(255,255,255,.65); line-height: 1.5; }

    .terrain {
        position: relative; height: 190px; margin-bottom: 18px;
        border-bottom: 3px solid rgba(255,255,255,.25);
    }
    /* Les poteaux, à droite du terrain. */
    .poteaux { position: absolute; right: 8%; bottom: 0; width: 86px; height: 150px; }
    .poteau {
        position: absolute; bottom: 0; width: 7px; height: 150px; border-radius: 4px;
        background: linear-gradient(180deg, #f2f2f2, #cfcfcf);
    }
    .poteau-g { left: 0; }
    .poteau-d { right: 0; }
    .barre {
        position: absolute; left: 0; right: 0; top: 52px; height: 7px; border-radius: 4px;
        background: linear-gradient(90deg, #cfcfcf, #f2f2f2, #cfcfcf);
    }
    .ballon {
        position: absolute; left: 0; bottom: 0; width: 46px; height: 30px;
        transform: translate(-50%, 50%) rotate(-18deg);
        transition: left .35s linear, bottom .35s linear;
    }
    .ballon svg { display: block; width: 100%; height: 100%; animation: vrille 1.9s linear infinite; }
    @keyframes vrille { to { transform: rotate(360deg); } }

    .barre-fond {
        height: 12px; border-radius: 999px; overflow: hidden;
        background: rgba(255,255,255,.12);
    }
    .barre-remplie {
        height: 100%; width: 0; border-radius: 999px;
        background: linear-gradient(90deg, #7b1b46, #f9a240);
        transition: width .35s linear;
    }
    .restant { margin-top: 12px; font-size: 1.05rem; font-weight: 700; }
    .message { margin-top: 6px; font-size: .85rem; color: rgba(255,255,255,.6); min-height: 20px; }

    @media (max-width: 420px) {
        .terrain { height: 150px; }
        .poteaux { height: 115px; width: 68px; }
        .poteau { height: 115px; }
        .barre { top: 40px; }
    }
</style>
</head>
<body>

<div class="reveil">
    <h1>{{ icons.rugby() }} Le serveur se réveille</h1>
    <p class="sous-titre">
        Le site s'était mis en veille faute d'utilisation.<br>
        Il redémarre : la page s'ouvrira toute seule.
    </p>

    <div class="terrain">
        <div class="poteaux">
            <div class="poteau poteau-g"></div>
            <div class="poteau poteau-d"></div>
            <div class="barre"></div>
        </div>
        <div class="ballon" id="ballon">
            <svg viewBox="0 0 34 22" aria-hidden="true">
                <ellipse cx="17" cy="11" rx="16" ry="10" fill="#7b1b46" stroke="#f9a240" stroke-width="1.5"/>
                <line x1="6" y1="11" x2="28" y2="11" stroke="#fff" stroke-width="1.4"/>
                <line x1="14" y1="7" x2="14" y2="15" stroke="#fff" stroke-width="1.4"/>
                <line x1="20" y1="7" x2="20" y2="15" stroke="#fff" stroke-width="1.4"/>
            </svg>
        </div>
    </div>

    <div class="barre-fond"><div class="barre-remplie" id="progression"></div></div>
    <div class="restant" id="restant">≈ 40 s</div>
    <div class="message" id="message"></div>
</div>

<script>
(function () {
    // Durée typique d'un redémarrage sur l'hébergement gratuit. Sert uniquement à
    // animer l'attente : dès que le serveur répond vraiment, on bascule sur la page.
    var DUREE = 40;
    var debut = Date.now();
    var ballon = document.getElementById('ballon');
    var progression = document.getElementById('progression');
    var restant = document.getElementById('restant');
    var message = document.getElementById('message');
    var arrive = false;

    function placer(part) {
        // Trajectoire en cloche : le ballon part du sol à gauche et passe au-dessus
        // de la barre au moment où la progression atteint les poteaux.
        var x = 4 + part * 92;                       // % de la largeur du terrain
        // Le ballon monte jusqu'à passer au-dessus de la barre transversale au moment
        // où il arrive sur les poteaux : c'est la transformation.
        var montee = Math.min(part / 0.85, 1);
        var y = Math.sin(montee * Math.PI / 2) * 118 + 6;
        ballon.style.left = x + '%';
        ballon.style.bottom = y + 'px';
    }

    function animer() {
        var ecoule = (Date.now() - debut) / 1000;
        var part = Math.min(ecoule / DUREE, 1);
        if (!arrive) {
            // On plafonne à 95 % tant que le serveur n'a pas répondu : pas de fausse
            // barre pleine si le réveil prend plus longtemps que prévu.
            var affichee = Math.min(part, 0.95);
            placer(affichee);
            progression.style.width = (affichee * 100) + '%';
            var reste = Math.max(Math.ceil(DUREE - ecoule), 0);
            if (reste > 0) {
                restant.textContent = '≈ ' + reste + ' s';
            } else {
                restant.textContent = 'presque prêt…';
                message.textContent = "Ça prend un peu plus longtemps que d'habitude.";
            }
        }
    }

    function reussi() {
        arrive = true;
        placer(1);
        progression.style.width = '100%';
        restant.textContent = 'Transformation !';
        message.textContent = 'Ouverture de la page…';
        setTimeout(function () { location.reload(); }, 450);
    }

    function sonder() {
        if (arrive) return;
        if (navigator.onLine === false) {
            restant.textContent = 'Hors connexion';
            message.textContent = 'Vérifie ta connexion internet.';
            return;
        }
        fetch('/ping', { cache: 'no-store' })
            .then(function (r) { if (r.ok) reussi(); })
            .catch(function () { /* serveur encore endormi : on retente */ });
    }

    placer(0);
    setInterval(animer, 300);
    setInterval(sonder, 1500);
    sonder();
})();
</script>
</body>
</html>
