{% extends "base.html" %}
{% block title %}{{ code }} — {{ titre }}{% endblock %}
{% block content %}

<div class="card erreur-page">
    <div class="erreur-code">{{ code }}</div>
    <h1>{{ titre }}</h1>
    <p>{{ message }}</p>
    <div class="erreur-actions">
        <a class="btn" href="{{ url_for('landing') }}">Retour à l'accueil</a>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Voir les matchs</a>
    </div>
</div>

{% endblock %}
