{% if is_admin %}{% set _bs = backup_status() %}{% if _bs.alert %}
<div class="card backup-banner no-print">
    <span>⚠ {% if _bs.never_downloaded %}Aucune sauvegarde téléchargée{% else %}Dernière sauvegarde téléchargée il y a {{ _bs.download_days }} jours{% endif %}</span>
    <span class="backup-actions"><a class="btn" href="{{ url_for('export_data') }}">Télécharger</a><a href="{{ url_for('admin_backups') }}">Détails</a></span>
</div>
{% endif %}{% endif %}
