<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Rugby Analytics{% endblock %}</title>
{% include "_pwa_head.html" %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="{{ url_for('static', filename='demo-mode.js') }}?v={{ asset_version }}"></script>
<script src="{{ url_for('static', filename='sortable.js') }}?v={{ asset_version }}"></script>
    <script>
if (window.Chart) { Chart.defaults.color = '#ffffff'; }
</script>
</head>
<body data-demo-forced="{{ 'true' if demo_forced else 'false' }}">
<img src="{{ url_for('static', filename='logo.png') }}" class="body-watermark no-print" alt="">
{% include "_match_subnav.html" %}
<main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-stack">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
<script>
/* Format diapositive (16/9, 1280 x 720 comme Keynote) pour les pages du rapport.
   Le cadre est mis à l'échelle de la largeur disponible, et son contenu est réduit
   d'autant s'il est plus haut que la diapo. */
(function () {
    var W = 1280, H = 720;
    function boards() {
        return document.querySelectorAll('.review-board, .report-board');
    }
    function prepare() {
        boards().forEach(function (board) {
            if (board.parentElement && board.parentElement.classList.contains('report-slide')) return;
            var slide = document.createElement('div');
            slide.className = 'report-slide';
            board.parentNode.insertBefore(slide, board);
            slide.appendChild(board);

            var inner = document.createElement('div');
            inner.className = 'report-inner';
            var nodes = Array.prototype.slice.call(board.childNodes);
            nodes.forEach(function (node) {
                if (node.nodeType === 1 && node.classList.contains('review-bg-img')) return;
                inner.appendChild(node);
            });
            board.appendChild(inner);
        });
    }
    var enCours = false;
    function fit() {
        if (enCours) return;
        enCours = true;
        document.querySelectorAll('.report-slide').forEach(function (slide) {
            var board = slide.querySelector('.review-board, .report-board');
            if (!board) return;
            var inner = board.querySelector('.report-inner');
            if (inner) {
                inner.style.setProperty('--content-scale', 1);
                var style = window.getComputedStyle(board);
                var dispo = H - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
                /* Hauteur naturelle du contenu, mesurée sans la contrainte de la diapo :
                   au-delà, on réduit le tout pour qu'il tienne dans le cadre. */
                inner.style.height = 'auto';
                var haut = inner.scrollHeight;
                inner.style.height = '';
                inner.style.setProperty('--content-scale', haut > dispo ? (dispo / haut) : 1);
            }
            var largeur = slide.clientWidth || W;
            var echelle = largeur / W;
            slide.style.setProperty('--slide-scale', echelle);
            slide.style.height = (H * echelle) + 'px';
        });
        window.requestAnimationFrame(function () { enCours = false; });
    }
    function init() {
        if (!boards().length) return;
        prepare();
        fit();
        window.addEventListener('resize', fit);
        if (window.ResizeObserver) {
            document.querySelectorAll('.report-inner').forEach(function (inner) {
                new ResizeObserver(fit).observe(inner);
            });
        }
        window.addEventListener('beforeprint', fit);
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
